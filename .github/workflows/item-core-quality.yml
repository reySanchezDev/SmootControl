name: Kivo Item Core - Quality and Dependency Inventory

on:
  push:
    branches:
      - feature/item-master-db-foundation
      - feature/item-core-f2-purchases-adjustments
      - feature/item-core-f2-staff-consumption
      - feature/item-core-f2-payroll-claim
      - feature/item-core-f2-payroll-backdate-guard
      - feature/item-core-f2-noninventory-consumption
      - feature/item-core-f2-pos-catalog-validated
      - feature/item-core-f2-pos-catalog-server
      - feature/item-core-f2-catalog-revision-writer
      - feature/item-core-f2-consumption-rule-revision
      - feature/item-core-f2-unit-revision
      - feature/item-core-f2-classification-revision
      - feature/item-core-f2-classification-master-revision
    paths:
      - 'lib/**'
      - 'test/**'
      - 'supabase/**'
      - 'tool/audit_item_core_dependencies.py'
      - '.github/workflows/item-core-quality.yml'
  pull_request:
    branches:
      - main
      - feature/item-master-db-foundation
      - feature/item-core-f2-unit-revision
      - feature/item-core-f2-classification-revision
    paths:
      - 'lib/**'
      - 'test/**'
      - 'supabase/**'
      - 'tool/audit_item_core_dependencies.py'
      - '.github/workflows/item-core-quality.yml'
  workflow_dispatch:

concurrency:
  group: kivo-item-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed-code:
    name: Detect Flutter-impacting changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.diff.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Identify changed paths
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREVIOUS_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'flutter=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PREVIOUS_SHA"
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$BASE_SHA"
          elif [ "$GITHUB_REF_NAME" != 'feature/item-master-db-foundation' ]; then
            git fetch --no-tags origin feature/item-master-db-foundation
            base="$(git merge-base HEAD origin/feature/item-master-db-foundation)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'flutter=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" "$CURRENT_SHA" |
            grep -Eq '^(lib/|test/|pubspec\.(yaml|lock)$|analysis_options\.yaml$)'; then
            echo 'flutter=true' >> "$GITHUB_OUTPUT"
          else
            echo 'flutter=false' >> "$GITHUB_OUTPUT"
          fi

  dependency-inventory:
    name: Read-only F2 dependency inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate static cross-module inventory
        run: |
          python3 tool/audit_item_core_dependencies.py \
            --output "$RUNNER_TEMP/item-core-dependencies.md"
          test -s "$RUNNER_TEMP/item-core-dependencies.md"
      - name: Confirm frozen F1 draft is not auto-executed
        run: |
          test -f supabase/design/ITEM_CORE_F1_DDL_DRAFT.sql
          test -f supabase/design/ITEM_CORE_F1_RPC_DRAFT.sql
          test -f supabase/tests/item_master_f1_rpc_isolated.sql
          test -f supabase/migrations/088_item_master_foundation.sql
          # Static guard: no SQL is executed in this workflow.
          # A path existence check does NOT invoke the frozen migration.
          ! grep -Eq '^[[:space:]]*supabase[[:space:]]+db[[:space:]]+(reset|push)' \
            .github/workflows/item-core-quality.yml
          ! grep -Eq '^[[:space:]]*psql .*supabase/migrations/088_' \
            .github/workflows/item-core-quality.yml
      - name: Upload dependency map
        uses: actions/upload-artifact@v4
        with:
          name: item-core-dependency-inventory
          path: ${{ runner.temp }}/item-core-dependencies.md
          retention-days: 14

  consumption-contract:
    name: F2 consumption rule SQL - isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: f2_fixture_only
          POSTGRES_DB: f2_item_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d f2_item_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: f2_fixture_only
      PGDATABASE: f2_item_contract
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL SQL contract test (rollback, isolated)
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/item_core_f2_consumption_isolated.sql
      - name: Sale schema contract (isolated transaction rollback)
        shell: bash
        run: |
          # Only remove the draft's transaction wrappers on this disposable DB.
          sed '/^BEGIN;$/d;/^ROLLBACK;$/d' \
            supabase/design/ITEM_CORE_F2_SALE_SCHEMA_DRAFT.sql \
            > "$RUNNER_TEMP/f2-sale-ddl.sql"
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/item_core_f2_sale_schema_fixture.sql \
            -f "$RUNNER_TEMP/f2-sale-ddl.sql" \
            -f supabase/tests/item_core_f2_sale_schema_assert.sql
      - name: Trusted stock engine contract (isolated rollback)
        run: |
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/item_core_f2_internal_ledger_fixture.sql \
            -f supabase/design/ITEM_CORE_F2_INTERNAL_LEDGER_DRAFT.sql \
            -f supabase/tests/item_core_f2_internal_ledger_assert.sql
      - name: POS V2 atomic sale + void contract (isolated rollback)
        shell: bash
        run: |
          sed '/^BEGIN;$/d;/^ROLLBACK;$/d' \
            supabase/design/ITEM_CORE_F2_SALE_SCHEMA_DRAFT.sql \
            > "$RUNNER_TEMP/f2-sale-ddl.sql"
          psql -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/item_core_f2_pos_sale_fixture.sql \
            -f "$RUNNER_TEMP/f2-sale-ddl.sql" \
            -f supabase/design/ITEM_CORE_F2_CONSUMPTION_DRAFT.sql \
            -f supabase/design/ITEM_CORE_F2_INTERNAL_LEDGER_DRAFT.sql \
            -f supabase/design/ITEM_CORE_F2_POS_SALE_RPC_DRAFT.sql \
            -f supabase/tests/item_core_f2_pos_sale_assert.sql

