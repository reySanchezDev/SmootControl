  flutter-quality:
    needs: changed-code
    if: needs.changed-code.outputs.flutter == 'true'
    name: Flutter tests and analyzer - bounded diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Flutter stable SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Environment info
        run: |
          flutter --version
          dart --version
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyzer - capture reproducible timeout/failure
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 180s \
            flutter analyze --no-pub > "$RUNNER_TEMP/flutter-analyze.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/flutter-analyze.log"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Flutter analyze exit: $status"
          exit "$status"
      - name: Analyze new F2.3 code independently
        if: always()
        shell: bash
        run: |
          timeout 90s dart analyze \
            lib/features/sync/domain/entities/item_catalog_snapshot_v2.dart
          timeout 90s dart analyze \
            test/features/sync/domain/entities/item_catalog_snapshot_v2_test.dart
      - name: Run all Flutter tests even when analyze is blocked
        id: tests
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 1200s \
            flutter test --no-pub -j 2 > "$RUNNER_TEMP/flutter-test.log" 2>&1
          status=$?
          tail -n 100 "$RUNNER_TEMP/flutter-test.log"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Upload tooling logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item-core-flutter-tooling-logs
          path: |
            ${{ runner.temp }}/flutter-analyze.log
            ${{ runner.temp }}/flutter-test.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce quality without masking analyzer hangs
        if: always()
        shell: bash
        env:
          ANALYZE_EXIT: ${{ steps.analyze.outputs.exit_code }}
          TEST_EXIT: ${{ steps.tests.outputs.exit_code }}
        run: |
          echo "Analyzer exit: ${ANALYZE_EXIT:-not-run}"
          echo "Tests exit: ${TEST_EXIT:-not-run}"
          if [ "${TEST_EXIT:-missing}" != 0 ]; then
            echo "Flutter tests failed or did not finish."
            exit 1
          fi
          if [ -z "${ANALYZE_EXIT:-}" ]; then
            echo "Flutter analyzer did not run."
            exit 1
          fi
          python3 tool/check_item_core_analyzer.py \
            --log "$RUNNER_TEMP/flutter-analyze.log" \
            --baseline tool/item_core_analyzer_baseline.json \
            --analyzer-exit "$ANALYZE_EXIT"
